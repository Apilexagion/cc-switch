name: CI

on:
  pull_request:
    branches: [main]
  push:
    # Validate the fork integration branch before tag-driven release builds.
    branches: [main, test/codex-chatgpt-auth-route, feat/magpie-inspired]
  # 每周一次全量：push 到 main 也按路径过滤后，靠它在缓存被淘汰后重新建起来
  schedule:
    - cron: "41 19 * * 0" # 周一 03:41（北京时间）
  workflow_dispatch:

concurrency:
  # PR 和 fork 集成分支只跑最新提交；main 每次运行独立，保留上游的逐提交验证。
  # main（push / 定时 / 手动）：每次运行单独一组、从不取消，发版要求 main 上每个提交都完整跑过。
  # 不能让它们共用一个组再关掉 cancel：一个组只留一个排队中的运行，连推时中间的提交照样会被挤掉。
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/magpie-inspired' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/magpie-inspired') }}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # 定时 / 手动运行不过滤（过滤步骤被跳过、输出为空），一律当作两边都有改动。
      # readme / frontend_contracts 默认 false：定时或手动运行时 frontend 已是 true，
      # 会跑全量前端检查与测试，不需要再单独起轻量 job。
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
      backend: ${{ steps.filter.outputs.backend || 'true' }}
      wsl: ${{ steps.filter.outputs.wsl || 'true' }}
      readme: ${{ steps.filter.outputs.readme || 'false' }}
      frontend_contracts: ${{ steps.filter.outputs.frontend_contracts || 'false' }}
    steps:
      # On pull_request the filter reads changed files via the API (no checkout);
      # on push it needs a local git history to diff against.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - "src/**"
              - "tests/**"
              - "scripts/**"
              - "index.html"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.json"
              - "tsconfig.node.json"
              - "vite.config.ts"
              - "vitest.config.ts"
              - "vitest.workspace.ts"
              - "tailwind.config.cjs"
              - "postcss.config.cjs"
              - "knip.json"
              - ".github/workflows/ci.yml"
            readme:
              - "README*.md"
            frontend_contracts:
              - "src-tauri/src/lib.rs"
              - "src-tauri/src/omp_config.rs"
              - "src-tauri/src/services/usage_stats.rs"
            backend:
              - "src-tauri/**"
              - "scripts/**"
              - "tests/config/*.json"
              - "tests/fixtures/**"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
            wsl:
              - "src-tauri/src/config.rs"
              - "src-tauri/src/error.rs"
              - "src-tauri/src/hermes_config.rs"
              - "src-tauri/src/sync_utils.rs"
              - "src-tauri/src/session_manager/**"
              - "src-tauri/src/lib.rs"
              - "src-tauri/Cargo.toml"
              - "src-tauri/Cargo.lock"
              - "src-tauri/build.rs"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: changes
    # PR 和 push 到 main 都按路径过滤。缓存 key 精确命中时不会重存，main 全量跑并不能
    # 预热什么；缓存被淘汰后由每周的定时全量重建。
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 版本取 package.json 的 packageManager。先装 pnpm，setup-node 才能按 pnpm-lock 缓存 store。
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 只有 build:renderer 写 dist/，其余 4 项为只读检查；并发跑完再按项回放日志，避免输出交错。
      - name: Run frontend checks & node unit tests
        shell: bash
        run: |
          set -euo pipefail
          log_dir="$RUNNER_TEMP/frontend-checks"
          mkdir -p "$log_dir"

          names=(
            "typecheck"
            "format:check"
            "knip"
            "build:renderer"
            "node unit tests"
          )
          cmds=(
            "pnpm typecheck"
            "pnpm format:check"
            "pnpm knip"
            "pnpm build:renderer"
            "pnpm test:unit --project=node-unisolated --project=node-isolated"
          )
          pids=()

          for i in "${!cmds[@]}"; do
            bash -eo pipefail -c "${cmds[$i]}" >"$log_dir/$i.log" 2>&1 &
            pids+=("$!")
          done

          status=0
          summary=()
          for i in "${!pids[@]}"; do
            rc=0
            wait "${pids[$i]}" || rc=$?
            if [ "$rc" -eq 0 ]; then
              summary+=("PASS: ${names[$i]}")
              echo "::group::[PASS] ${names[$i]}"
              cat "$log_dir/$i.log"
              echo "::endgroup::"
            else
              status=1
              summary+=("FAIL (exit $rc): ${names[$i]}")
              echo "::error::Frontend check failed: ${names[$i]} (exit $rc)"
              echo "=== [FAIL] ${names[$i]} (exit $rc) ==="
              cat "$log_dir/$i.log"
            fi
          done

          echo "=== Frontend Checks Summary ==="
          printf '%s\n' "${summary[@]}"
          exit "$status"

      # Produce reviewable formatting patches in the cloud as well. This allows
      # source-only local checkouts to fix formatting without installing Node deps.
      - name: Report frontend formatting patches
        if: failure()
        shell: bash
        run: |
          pnpm format > "$RUNNER_TEMP/frontend-format-fixes.log" 2>&1
          python - <<'PY'
          import base64
          import gzip
          import subprocess

          paths = subprocess.check_output(["git", "diff", "--name-only", "--", "src/", "tests/"]).decode().splitlines()
          for path in paths:
              patch = subprocess.check_output(["git", "diff", "--", path])
              encoded = base64.b64encode(gzip.compress(patch)).decode()
              if len(encoded) <= 55000:
                  print(f"::error title=prettier-patch::{path} PATCH_GZIP_BASE64:{encoded}")
          PY

  codex-config-contract:
    name: Official Codex configuration contract (0.162.1)
    # 22.04 allows the official CLI's user-namespace sandbox probe. Newer
    # hosted images restrict that probe independently of configuration validity.
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Codex sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install

      - name: Install fixture export dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned official CLI
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-contract-cli" --no-audit --no-fund @openai/codex@0.162.1
          "$RUNNER_TEMP/codex-contract-cli/node_modules/.bin/codex" --version

      - name: Export actual application configurations
        shell: bash
        run: |
          CODEX_CONFIG_FIXTURES_DIR="$RUNNER_TEMP/codex-contract/fixtures" \
            pnpm exec vitest run tests/contracts/codexConfigFixtures.test.ts

      - name: Generate official app-server protocol schema
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/codex-contract/schema-home"
          CODEX_HOME="$RUNNER_TEMP/codex-contract/schema-home" \
            "$RUNNER_TEMP/codex-contract-cli/node_modules/.bin/codex" \
            app-server generate-json-schema --out "$RUNNER_TEMP/codex-contract/protocol-schema"

      - name: Strict-load fixtures with official config/read
        shell: bash
        run: |
          python scripts/validate-codex-config.py \
            --codex "$RUNNER_TEMP/codex-contract-cli/node_modules/.bin/codex" \
            --fixtures "$RUNNER_TEMP/codex-contract/fixtures" \
            --report "$RUNNER_TEMP/codex-contract/report.json" \
            2>&1 | tee "$RUNNER_TEMP/codex-contract-validation.log"

      - name: Publish contract result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          report = pathlib.Path(os.environ["RUNNER_TEMP"]) / "codex-contract/report.json"
          if report.exists():
              data = json.loads(report.read_text())
              failures = [row for row in data["fixtures"] if row["status"] != "passed"]
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(f"Official Codex {data['version']}: {len(data['fixtures']) - len(failures)}/{len(data['fixtures'])} configurations loaded; {data['negativeControls']} unknown-field controls rejected.\n")
              for row in failures:
                  message = f"{row['name']}: {row['error']}".replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Codex config contract::{message}")
          PY

      - name: Upload configuration contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-config-contract-0.162.1
          path: |
            ${{ runner.temp }}/codex-contract/report.json
            ${{ runner.temp }}/codex-contract/fixtures/
            ${{ runner.temp }}/codex-contract/protocol-schema/
            ${{ runner.temp }}/codex-contract-validation.log
          if-no-files-found: warn
          retention-days: 7

  # 纯 Node 单测（node-unisolated / node-isolated）已并入 Frontend Checks；
  # 这里只跑需要 jsdom 与进程隔离的组件/Hook 测试，分到 2 台机器并行。
  frontend-tests:
    name: Frontend Tests (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 版本取 package.json 的 packageManager。先装 pnpm，setup-node 才能按 pnpm-lock 缓存 store。
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:unit --project=jsdom --shard=${{ matrix.shard }}/2

  # 只改 README*.md 时不触发整套前端检查，单独跑多语言 README 一致性测试。
  readme-parity:
    name: README Parity
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.readme == 'true' && needs.changes.outputs.frontend != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run README parity test
        run: pnpm test:unit --project=node-unisolated tests/config/readmeParity.test.ts

  # 只改前端契约测试直接解析的 Rust 源文件时，补跑对应 3 个跨端契约测试，避免静默漂移。
  frontend-contracts:
    name: Frontend Contract Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend_contracts == 'true' && needs.changes.outputs.frontend != 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend contract tests
        run: pnpm test:unit --project=node-unisolated tests/lib/registeredCommands.test.ts tests/config/ompProviderPresets.test.ts tests/components/usageProviderLabel.test.ts

  backend:
    name: Backend Checks
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # rust-toolchain.toml 是编译器版本的唯一来源：直接装它，免得先装 stable 再被 rustup 换掉
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: ${{ runner.os == 'Linux' && 'rustfmt, clippy' || 'clippy' }}

      # 格式和系统无关，只在 Linux 上查一次；放在装依赖、恢复缓存之前，格式不对几秒就报错
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        shell: bash
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/backend-format.log"

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      # 只缓存依赖：本仓库的 crate 每次都要重编，缓存它只会让缓存变大、恢复变慢。
      # key 自带 OS、rustc 版本和 Cargo.lock；shared-key 让 wsl2-nightly 能读到 Windows 这份。
      # backend-v2：对齐 [profile.dev.package] 优化依赖与 clippy --all-targets 的缓存指纹。
      # 只有 main 保存：PR 能读 main 的缓存，PR 自己存的别人读不到，三个系统一份 3 GB 多，
      # 存下来只会把 main 的缓存挤出仓库 10 GB 的配额。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: backend-v2
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/magpie-inspired' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Clippy
        shell: bash
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/backend-clippy.log"

      # 每个测试一个进程，单测超时见 src-tauri/.config/nextest.toml。doctest 目前只有两个
      # ignored，nextest 不跑 doctest 也不漏。
      - name: Run tests
        shell: bash
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --profile ci 2>&1 | tee "$RUNNER_TEMP/backend-tests.log"

      # Expose actionable diagnostics in the public checks API as well. Downloading
      # full Actions logs requires repository access, even for this public fork.
      - name: Report backend failure diagnostics
        if: failure()
        shell: bash
        env:
          # Windows Python defaults to cp1252; Rust diagnostics contain Chinese
          # and Unicode symbols that must reach the Actions annotation intact.
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          for path in sorted(pathlib.Path(os.environ["RUNNER_TEMP"]).glob("backend-*.log")):
              text = path.read_text(encoding="utf-8", errors="replace")
              text = re.sub(r"\x1b\[[0-9;]*m", "", text)
              lines = [line for line in text.splitlines() if not re.match(r"\s*(?:PASS|SKIP)\s+\[", line)]
              sections = []
              seen = set()
              for match in re.finditer(r"(?m)^\s*(?:FAIL|TIMEOUT)\s+\[[^\n]+", text):
                  title = match.group().strip()
                  if title in seen:
                      continue
                  seen.add(title)
                  following = text[match.end():]
                  boundary = re.search(r"(?m)^\s*(?:PASS|SKIP|FAIL|TIMEOUT|SLOW|LEAK)\s+\[|^─{6,}", following)
                  block = following[:boundary.start()] if boundary else following
                  sections.append((title, f"{title}\n{block.strip()}"[-3500:]))
              if sections:
                  for number, (_, section) in enumerate(sections, 1):
                      escaped = section.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title={path.stem} failure {number}::{escaped}")
                  continue
              tail = "\n".join(lines[-100:])[-3500:]
              escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={path.stem}::{escaped}")
          PY

      # WSL2 契约测试并入 Windows backend，直接复用 nextest 刚编好的 cc_switch_lib 测试二进制，
      # 省掉独立 Windows VM、缓存恢复和重复编译；PR 仅在命中 wsl 闭包时触发，push/定时/手动必跑。
      - name: Setup WSL2
        if: runner.os == 'Windows' && (github.event_name != 'pull_request' || needs.changes.outputs.wsl == 'true')
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: python3

      # 使用 /var/tmp 而非 /tmp（与 wsl2-nightly.yml 对齐，避免 distro 重启清空 /tmp）。
      # 直接定位 nextest 已编好的 cc_switch_lib-*.exe，不再调用 cargo test --lib --no-run，
      # 避免 tauri::generate_context! 共享 OUT_DIR 时间戳触发无谓重编与 UNC TEMP 下的 LNK1327。
      - name: Prepare WSL2-backed test environment & locate test binary
        if: runner.os == 'Windows' && (github.event_name != 'pull_request' || needs.changes.outputs.wsl == 'true')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          wsl.exe -d Ubuntu-24.04 -- bash -lc "rm -rf /var/tmp/cc-switch-windows-test-root && mkdir -p /var/tmp/cc-switch-windows-test-root/{home,temp} && chmod -R 0777 /var/tmp/cc-switch-windows-test-root"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $testRoot = "\\wsl.localhost\Ubuntu-24.04\var\tmp\cc-switch-windows-test-root"
          $testHome = Join-Path $testRoot "home"
          $testTemp = Join-Path $testRoot "temp"
          foreach ($path in @($testRoot, $testHome, $testTemp)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "WSL2-backed test path is unavailable: $path"
            }
          }
          $bins = @(Get-ChildItem -LiteralPath "src-tauri/target/debug/deps" -Filter "cc_switch_lib-*.exe" -File)
          if (@($bins).Count -ne 1) {
            $found = if (@($bins).Count -eq 0) { "(none)" } else { ($bins | ForEach-Object { $_.FullName }) -join ", " }
            throw "Expected exactly 1 cc_switch_lib-*.exe test binary in src-tauri/target/debug/deps, found $(@($bins).Count): $found"
          }
          $testBinary = $bins[0].FullName
          "CC_SWITCH_TEST_EXE=$testBinary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_TEST_HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_DIR=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows-to-WSL2 filesystem contract
        if: runner.os == 'Windows' && (github.event_name != 'pull_request' || needs.changes.outputs.wsl == 'true')
        # Run the test binary built by nextest directly. Invoking cargo here
        # with TEMP pointing at a WSL UNC path can re-link the crate, and
        # link.exe/mt.exe cannot create manifest temp files on \\wsl.localhost.
        shell: pwsh
        run: |
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $testName = "config::tests::atomic_write_replaces_existing_wsl_unc_file"
          $testList = & $env:CC_SWITCH_TEST_EXE --list --ignored
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $expected = "${testName}: test"
          if ($testList -notcontains $expected) {
            throw "Expected ignored test was not discovered: $testName"
          }
          & $env:CC_SWITCH_TEST_EXE $testName --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run Hermes live WAL reads inside WSL2
        if: runner.os == 'Windows' && (github.event_name != 'pull_request' || needs.changes.outputs.wsl == 'true')
        env:
          CC_SWITCH_WSL_DISTRO: Ubuntu-24.04
        shell: pwsh
        run: |
          $testName = "session_manager::providers::hermes::tests::wsl2_live_wal_readonly_reference"
          $testList = & $env:CC_SWITCH_TEST_EXE --list --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($testList -notcontains "${testName}: test") { throw "Hermes WSL test not discovered" }
          & $env:CC_SWITCH_TEST_EXE $testName --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # 分支保护里唯一的必过检查。各 job 按路径分流会被跳过，不能逐个设成必过（被跳过的永远等不到结果），
  # 所以由这个 job 汇总：每个上游 job 要么成功、要么被跳过，失败或取消即拦下。
  # if: always() 不能去掉：没有它，上游一失败这里就被跳过，而跳过在 GitHub 看来等于通过。
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [changes, frontend, frontend-tests, codex-config-contract, readme-parity, frontend-contracts, backend]
    if: always()
    permissions: {}
    steps:
      - name: Require every job to pass or be skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Upstream results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job ended as '$r'"; exit 1 ;;
            esac
          done
